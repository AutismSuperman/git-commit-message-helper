name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon --stacktrace

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.zip
          generate_release_notes: true

  # One-time backfill: tags pushed before CI existed have no entry on the Releases page
  backfill-legacy-releases:
    if: github.ref == 'refs/tags/v1.6.5'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create missing releases for legacy tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in v1.5.0 v1.5.1 v1.5.2 v1.5.3 v1.5.4 v1.6.0 v1.6.1 v1.6.2; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "Release for $tag already exists, skipping"
              continue
            fi
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$tag" --generate-notes
            echo "Created release for $tag"
          done
